<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Bank - LifeOS</title>
    <link rel="icon" href="https://fav.farm/🧠">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e' },
                        secondary: { 50: '#fdf4ff', 100: '#fae8ff', 200: '#f5d0fe', 300: '#f0abfc', 400: '#e879f9', 500: '#d946ef', 600: '#c026d3', 700: '#a21caf', 800: '#86198f', 900: '#701a75' },
                        surface: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body class="bg-surface-50 text-surface-900 font-sans antialiased">
    <script src="components/navbar.js"></script>
    <script src="components/sidebar.js"></script>

    <lifeos-navbar></lifeos-navbar>

    <div class="flex min-h-screen pt-16">
        <lifeos-sidebar></lifeos-sidebar>

        <main class="flex-1 lg:ml-64 p-4 lg:p-8">
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-surface-900 mb-2">Memory Bank</h1>
                <p class="text-surface-500">View and manage everything LifeOS knows about you.</p>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-8">
                <div class="bg-white p-4 rounded-xl border border-surface-200 shadow-sm">
                    <span class="text-xs font-semibold text-primary-600 uppercase tracking-wider">Habits</span>
                    <p class="text-2xl font-bold mt-1" id="count-habits">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl border border-surface-200 shadow-sm">
                    <span class="text-xs font-semibold text-secondary-600 uppercase tracking-wider">Preferences</span>
                    <p class="text-2xl font-bold mt-1" id="count-preferences">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl border border-surface-200 shadow-sm">
                    <span class="text-xs font-semibold text-amber-600 uppercase tracking-wider">Decisions</span>
                    <p class="text-2xl font-bold mt-1" id="count-decisions">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl border border-surface-200 shadow-sm">
                    <span class="text-xs font-semibold text-emerald-600 uppercase tracking-wider">Goals</span>
                    <p class="text-2xl font-bold mt-1" id="count-goals">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl border border-surface-200 shadow-sm">
                    <span class="text-xs font-semibold text-rose-600 uppercase tracking-wider">Constraints</span>
                    <p class="text-2xl font-bold mt-1" id="count-constraints">0</p>
                </div>
            </div>

            <!-- Data List -->
            <div class="bg-white rounded-xl shadow-sm border border-surface-200">
                <div class="p-6 border-b border-surface-200 flex justify-between items-center">
                    <h2 class="font-semibold text-lg">All Records</h2>
                    <button onclick="LifeOS.clear()"
                        class="text-sm text-rose-600 hover:text-rose-800 font-medium px-3 py-1.5 rounded-lg hover:bg-rose-50 transition-colors">
                        Clear All Data
                    </button>
                </div>
                <div id="memory-container" class="p-6 grid gap-4 grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
                    <!-- Configured internally by script.js -->
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Update specific counts for this page
            setTimeout(() => {
                document.getElementById('count-habits').textContent = LifeOS.memory.habits.length;
                document.getElementById('count-preferences').textContent = LifeOS.memory.preferences.length;
                document.getElementById('count-decisions').textContent = LifeOS.memory.decisions.length;
                document.getElementById('count-goals').textContent = LifeOS.memory.goals.length;
                document.getElementById('count-constraints').textContent = LifeOS.memory.constraints.length;
            }, 100);
        });
        feather.replace();
    </script>
</body>

</html>
